<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <link rel="stylesheet" href="signin.css">
    <link rel="stylesheet" href="">

</head>
<body>
    <a href="/"><img class="logo" src="./assets/amazon_logo_dark.png" alt="" width="100px"></a>
    
    <div class="sigin-in-container">
        <h1 class="sigin-title">SIGIN-UP</h1>
        <h5 class="input-lable">your name</h5>
        <input type="text" placeholder="first name ans last name">
        <h5 class="input-lable">mobile number or email</h5>
        <input type="email" >
        <h5 class="input-lable">password</h5>
        <input type="password" placeholder="enter at least 6 character">
        <button>continue</button>
        <p class="sigin-in-condition">by continuing ,you agree to amazon's 
            <span>condition of use</span> and 
            <span>privacy notice</span>
        </p>
        <p class="sigin-help">&#9656 <span>need help</span></p>
        <hr>
        <h4>buying for work?</h4>
        <p class="sigin-business"><span>shop on amazon business</span></p>
    </div>

<!--🧠 Why the <hr> “disappears” or doesn’t look right:
By setting display: flex on .sigin-bottom, all direct children (like <hr> and <p>) 
become flex items arranged in a row by default — not stacked vertically.
But <hr> is meant to stretch horizontally — and as a flex item inside a row layout, 
it now behaves like an inline box, collapsing to its content size.-->

    <div class="sigin-bottom">
        <hr>
        <p>have an account?</p>
        <hr>
    </div>

    <a href="signin.html">
        <button class="sigin-signup-btn">login with amazon account</button>
    </a>
    <footer>
        <div class="footer-links">
            <a href="#">condition of use</a>   |
            <a href="#">privacy notice</a>   |
            <a href="#">help</a>
        </div>
        <p class="footer-copyrigth">@ 1996-2024 ,amazon.com ,inc. or its affiliates</p>
    </footer>
</body>
</html>
